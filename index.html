<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CatchUp AI – What Did I Miss?</title>
<meta name="description" content="Catch up on unread group chats privately. Everything runs in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M18 34l10 10 18-22' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f8fafc;color:#0f172a;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{margin:0;font-size:24px}h1 span{font-weight:400;color:#64748b}
.sub{color:#64748b;font-size:13px;margin:2px 0 16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;box-shadow:0 1px 2px #0000000d;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#64748b}
label{display:block;font-size:13px;color:#475569}
input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:8px 10px;background:#fff;color:inherit}
label input{width:100%;margin-top:4px}
textarea.big{width:100%;height:170px;font:13px ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;flex-wrap:wrap;gap:8px}.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:12px}
button{font:inherit;font-weight:600;font-size:14px;border-radius:10px;padding:8px 14px;border:1px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer}
button:hover{background:#f1f5f9}button.pri{background:#4f46e5;border-color:#4f46e5;color:#fff}button.pri:hover{background:#4338ca}
.stats{display:grid;gap:12px;grid-template-columns:repeat(5,1fr);margin-bottom:16px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px}.stat b{display:block;font-size:26px}.stat small{color:#64748b}
.hero{background:#4f46e5;color:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
.hero p{margin:0;max-width:680px;font-size:14px}.hero button{background:#6366f1;border-color:#818cf8;color:#fff}.hero button:hover{background:#818cf8}.hero button.w{background:#fff;color:#4338ca}
.cols{display:grid;gap:16px;grid-template-columns:2fr 1fr;align-items:start}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item,.task,.sv{background:#f8fafc;border:1px solid #f1f5f9;border-radius:12px;padding:10px}
.item p{margin:4px 0 0;font-size:14px}.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.time{color:#94a3b8;font-size:12px}.due{background:#eef2ff;color:#4338ca;border-radius:6px;padding:0 6px;font-size:12px}.tags{color:#94a3b8;font-size:11px}
.badge{border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;text-transform:uppercase}
.high{background:#fee2e2;color:#b91c1c}.medium{background:#fef3c7;color:#b45309}.low{background:#e2e8f0;color:#475569}
.item.high{border-left:4px solid #ef4444}.empty{color:#94a3b8;font-size:14px;margin:0}
.task .top{display:flex;gap:8px;align-items:flex-start}.task textarea{flex:1;border-color:transparent;background:transparent;resize:none;padding:4px;font-size:14px}
.task textarea:hover,.task textarea:focus{border-color:#cbd5e1;background:#fff}.task.done textarea{text-decoration:line-through;color:#94a3b8}
.task .bot{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0 26px}.task .bot input,.task .bot select{padding:3px 6px;font-size:12px;border-radius:6px}
.x{border:0;background:none;color:#94a3b8;padding:2px 6px}.x:hover{color:#dc2626;background:none}
.sv{display:flex;justify-content:space-between;gap:8px;align-items:center}.sv a{color:#4338ca;cursor:pointer;font-weight:600;font-size:14px;word-break:break-word}.sv small{display:block;color:#94a3b8;font-weight:400}
#toast{position:fixed;right:16px;bottom:16px;background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:9}
@media(max-width:800px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>CatchUp AI <span>– What Did I Miss?</span></h1>
  <p class="sub">🔒 Everything runs in your browser. Nothing is sent anywhere; data is stored only on this device.</p>

  <div class="card">
    <h2>1 · Add a conversation</h2>
    <div class="grid2">
      <label>Your name (to find your mentions)<input id="user" placeholder="e.g. Alex"></label>
      <label>Chat title<input id="title" placeholder="e.g. Project group"></label>
    </div>
    <textarea id="text" class="big" placeholder="Paste chat here, e.g.&#10;[12/03/2025, 10:02] Sam: Please send the report by Friday"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="pri" id="go">Catch me up</button>
      <button id="up">Upload .txt file</button>
      <input type="file" id="file" accept=".txt,.md,.log,.csv,text/plain" hidden>
      <button data-s="0">Sample: Study group</button>
      <button data-s="1">Sample: Work team</button>
      <button id="clr">Clear</button>
    </div>
  </div>

  <p id="empty" class="empty" style="text-align:center;padding:30px 0">Your summary will appear here.</p>

  <div id="out" hidden>
    <div class="stats" id="stats"></div>
    <div class="hero">
      <p id="overview"></p>
      <div class="row">
        <button class="w" id="save">Save</button>
        <button id="xmd">Export .md</button>
        <button id="xjs">Export .json</button>
        <button id="cp">Copy</button>
      </div>
    </div>
    <div class="cols">
      <div>
        <div class="card"><h2>🔥 Needs attention first</h2><div id="attn"></div></div>
        <div class="card"><h2>Mentions of you</h2><div id="ment"></div></div>
        <div class="card"><h2>Decisions</h2><div id="dec"></div></div>
        <div class="card"><h2>Deadlines &amp; dates</h2><div id="dead"></div></div>
      </div>
      <div>
        <div class="card"><h2>Task list</h2><ul id="tasks"></ul>
          <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="nt" placeholder="Add a task" style="flex:1;min-width:0"><button class="pri" id="at">Add</button></div>
        </div>
        <div class="card"><h2 id="svh">Saved summaries</h2><ul id="saved"></ul><button id="delall" style="margin-top:10px;width:100%" hidden>Delete all</button></div>
      </div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
// ===== ANALYZER START (100% local, rule-based; no network, no API) =====
const SAMPLES=[
{title:'Study group – Databases project',text:`[12/03/2025, 09:12] Priya: morning all! Did anyone finish the ER diagram?
[12/03/2025, 09:20] Marcus: Almost done, will upload tonight
[12/03/2025, 10:02] Prof. Rao: URGENT: project submission deadline moved to Friday 5pm. No extensions!!
[12/03/2025, 10:05] Priya: @Alex can you review the SQL queries before Thursday?
[12/03/2025, 10:30] Marcus: We decided to go with PostgreSQL instead of MySQL
[12/03/2025, 11:15] Sara: lol that lecture was so long
[12/03/2025, 12:40] Priya: Alex, are you presenting the demo on Friday?
[12/03/2025, 13:05] Sara: I'll prepare the slides by tomorrow
[12/03/2025, 14:22] Marcus: Reminder: bring your student ID to the lab on Thursday
[12/03/2025, 15:00] Sara: Confirmed, viva moved to 3pm on Saturday`},
{title:'Work team – Product launch',text:`Dana: Good morning team. Launch review is happening today at 4pm.
Chris: Please send the final pricing sheet to finance by EOD
Dana: Important: the client cancelled the Tuesday demo, we need to reschedule asap
Lee: Agreed, let's go with the Wednesday slot instead
Chris: @Alex need your sign-off on the press release before tomorrow
Lee: Anyone seen the new logo? Looks great
Dana: Alex, can you confirm the budget numbers today?
Lee: I will update the roadmap doc by Friday
Chris: Decision made: we're approved to hire two contractors in November
Dana: Don't forget to submit your expense reports by 25/03`}];
const LINE=/^\s*((?:\[?\d{1,4}[\/.-]\d{1,2}[\/.-]\d{1,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:[AaPp][Mm])?\]?\s*[-–]?\s*|\[?\d{1,2}:\d{2}\s*(?:[AaPp][Mm])?\]?\s*[-–]?\s*)?)([^:\n]{1,40}):\s+(.*)$/;
const DATE=/\b(today|tonight|tomorrow|eod|end of (?:day|week)|next week|(?:by|before|on|due|until)\s+(?:mon|tues?|wed(?:nes)?|thu(?:rs)?|fri|sat|sun)[a-z]*|(?:mon|tues|wednes|thurs|fri|satur|sun)day|\d{1,2}\s?(?:am|pm)|\d{1,2}[\/-]\d{1,2}|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2})\b/i;
const RX={
 urgent:/\b(urgent|asap|immediately|critical|emergency|important|right now|last call|cancelled|canceled)\b|!{2,}/i,
 task:/\b(please|can you|could you|need(?:s)? to|have to|must|todo|to-do|action item|don't forget|remember to|i'll|i will|submit|send|bring|prepare|finish|review|update|upload)\b/i,
 decision:/\b(decided|decision|let'?s go with|going with|agreed|we(?:'ll| will) (?:go|use|meet)|confirmed|approved|settled|moved to|rescheduled)\b/i};
const WEIGHT={urgent:3,deadline:2,mention:3,task:2,decision:2,question:1};
const escRx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const clip=(s,n=140)=>s.length>n?s.slice(0,n-1)+'…':s;
const prio=s=>s>=6?'high':s>=3?'medium':'low';
function parse(raw){const out=[];for(const l of raw.split(/\r?\n/)){if(!l.trim())continue;const m=l.match(LINE);
 if(m)out.push({id:out.length,time:m[1].trim()||'',author:m[2].trim(),text:m[3].trim()});else if(out.length)out[out.length-1].text+=' '+l.trim()}return out}
function analyze(raw,user,title){
 const msgs=parse(raw),me=user.trim(),meRx=me?new RegExp('(^|\\W)@?'+escRx(me)+'\\b','i'):null,bc=/@(all|everyone|channel|here)\b/i,items=[];
 for(const msg of msgs){const t=msg.text,tags=[],mine=!!me&&msg.author.toLowerCase()===me.toLowerCase(),due=(t.match(DATE)||[])[0];
  if(RX.urgent.test(t))tags.push('urgent');if(due)tags.push('deadline');if(RX.decision.test(t))tags.push('decision');if(RX.task.test(t))tags.push('task');
  if(!mine&&((meRx&&meRx.test(t))||bc.test(t)))tags.push('mention');if(t.includes('?')&&tags.includes('mention'))tags.push('question');
  if(!tags.length)continue;const score=tags.reduce((n,g)=>n+WEIGHT[g],0);items.push({msg,score,priority:prio(score),tags,due})}
 const tasks=items.filter(i=>i.tags.includes('task')||(i.tags.includes('mention')&&i.due)).map(i=>{const t=i.msg.text,at=(t.match(/@(\w+)/)||[])[1];
  const owner=i.tags.includes('mention')&&me?me:at||(/\b(i'll|i will)\b/i.test(t)?i.msg.author:'Unassigned');
  return{id:uid(),text:clip(t),owner,due:i.due||'',priority:i.priority,done:false}});
 const people=new Set(msgs.map(m=>m.author)).size,top=[...items].sort((a,b)=>b.score-a.score)[0];
 const overview=msgs.length?`${msgs.length} messages from ${people} people. ${items.filter(i=>i.priority==='high').length} high-priority, ${items.filter(i=>i.tags.includes('decision')).length} decisions, ${tasks.length} tasks, ${items.filter(i=>i.tags.includes('mention')).length} mention you.`+(top?` Start with: "${clip(top.msg.text,90)}"`:''):'No messages recognised. Use lines like "Name: message".';
 return{id:uid(),title:title||'Untitled chat',createdAt:new Date().toISOString(),user:me,messages:msgs.length,people,overview,items,tasks}}
function toMarkdown(s){
 const sec=(h,r)=>r.length?`\n## ${h}\n${r.join('\n')}\n`:'';
 const line=i=>`- [${i.priority.toUpperCase()}] **${i.msg.author}**: ${i.msg.text}${i.due?` _(when: ${i.due})_`:''}`;
 const by=[...s.items].sort((a,b)=>b.score-a.score);
 return `# CatchUp: ${s.title}\n_${new Date(s.createdAt).toLocaleString()}_\n\n${s.overview}\n`+
  sec('Needs attention first',by.filter(i=>i.priority==='high').map(line))+sec('Decisions',by.filter(i=>i.tags.includes('decision')).map(line))+
  sec('Deadlines',by.filter(i=>i.due).map(line))+sec('Mentions',by.filter(i=>i.tags.includes('mention')).map(line))+
  sec('Tasks',s.tasks.map(t=>`- [${t.done?'x':' '}] ${t.text} (owner: ${t.owner}${t.due?`, due: ${t.due}`:''}, ${t.priority})`))}
// ===== ANALYZER END =====

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cur=load('catchup.current',null),saved=load('catchup.saved',[]);
$('#user').value=load('catchup.user','');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}
function persist(){store('catchup.current',cur);if(cur&&saved.some(s=>s.id===cur.id)){saved=saved.map(s=>s.id===cur.id?cur:s);store('catchup.saved',saved);renderSaved()}}
const itemHTML=i=>`<li class="item ${i.priority}"><div class="meta"><span class="badge ${i.priority}">${i.priority}</span><b>${esc(i.msg.author)}</b>${i.msg.time?`<span class="time">${esc(i.msg.time.replace(/[\[\]]/g,''))}</span>`:''}${i.due?`<span class="due">⏰ ${esc(i.due)}</span>`:''}</div><p>${esc(i.msg.text)}</p><div class="tags">${i.tags.map(t=>'#'+t).join(' ')}</div></li>`;
const list=(a,e)=>a.length?`<ul>${a.map(itemHTML).join('')}</ul>`:`<p class="empty">${e}</p>`;
function render(){
 $('#out').hidden=!cur;$('#empty').hidden=!!cur;if(!cur)return;
 const s=[...cur.items].sort((a,b)=>b.score-a.score),hi=s.filter(i=>i.priority==='high');
 $('#stats').innerHTML=[['Messages',cur.messages],['High priority',hi.length],['Decisions',s.filter(i=>i.tags.includes('decision')).length],['Deadlines',s.filter(i=>i.due).length],['Open tasks',cur.tasks.filter(t=>!t.done).length]].map(([k,v])=>`<div class="stat"><b>${v}</b><small>${k}</small></div>`).join('');
 $('#overview').textContent=cur.overview;
 $('#attn').innerHTML=list(hi.length?hi:s.slice(0,3),'Nothing urgent 🎉');
 $('#ment').innerHTML=list(s.filter(i=>i.tags.includes('mention')),$('#user').value.trim()?'No mentions found.':'Enter your name above to find mentions.');
 $('#dec').innerHTML=list(s.filter(i=>i.tags.includes('decision')),'No decisions detected.');
 $('#dead').innerHTML=list(s.filter(i=>i.due),'No deadlines detected.');
 renderTasks();renderSaved()}
function renderTasks(){
 const ts=[...cur.tasks].sort((a,b)=>a.done-b.done);
 $('#tasks').innerHTML=ts.length?ts.map(t=>`<li class="task ${t.done?'done':''}" data-id="${t.id}"><div class="top"><input type="checkbox" data-f="done" ${t.done?'checked':''} aria-label="Done" style="margin-top:8px"><textarea rows="2" data-f="text">${esc(t.text)}</textarea><button class="x" data-del aria-label="Delete task">✕</button></div><div class="bot"><select data-f="priority">${['high','medium','low'].map(p=>`<option ${p===t.priority?'selected':''}>${p}</option>`).join('')}</select><input data-f="owner" value="${esc(t.owner)}" size="8" aria-label="Owner"><input data-f="due" value="${esc(t.due||'')}" size="10" placeholder="due" aria-label="Due"></div></li>`).join(''):'<p class="empty">No tasks found. Add your own below.</p>'}
function renderSaved(){
 $('#svh').textContent=`Saved summaries (${saved.length})`;$('#delall').hidden=!saved.length;
 $('#saved').innerHTML=saved.length?saved.map(s=>`<li class="sv"><a data-open="${s.id}">${esc(s.title)}<small>${esc(new Date(s.createdAt).toLocaleString())}</small></a><button class="x" data-rm="${s.id}" aria-label="Delete saved">✕</button></li>`).join(''):'<p class="empty">Nothing saved yet.</p>'}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const safe=()=>(cur.title||'catchup').replace(/[^\w-]+/g,'_');

$('#user').addEventListener('input',e=>store('catchup.user',e.target.value));
$('#go').onclick=()=>{const t=$('#text').value;if(!t.trim())return toast('Paste or upload a conversation first.');
 cur=analyze(t,$('#user').value,$('#title').value);store('catchup.current',cur);render();toast(cur.messages?'Summary ready.':'No messages recognised – use "Name: message" lines.');
 if(cur.messages)$('#out').scrollIntoView({behavior:'smooth'})};
$('#up').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#text').value=await f.text();$('#title').value=f.name.replace(/\.[^.]+$/,'');e.target.value='';toast('Loaded '+f.name)};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const s=SAMPLES[b.dataset.s];$('#text').value=s.text;$('#title').value=s.title});
$('#clr').onclick=()=>{$('#text').value='';$('#title').value=''};
$('#save').onclick=()=>{if(!cur)return;saved=[cur,...saved.filter(s=>s.id!==cur.id)];store('catchup.saved',saved);renderSaved();toast('Saved on this device.')};
$('#xmd').onclick=()=>download(safe()+'.md',toMarkdown(cur),'text/markdown');
$('#xjs').onclick=()=>download(safe()+'.json',JSON.stringify(cur,null,2),'application/json');
$('#cp').onclick=()=>{const t=toMarkdown(cur);const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied.')}catch(e){toast('Copy failed.')}a.remove()};
 navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Copied.'),fb):fb()};
function addTask(){const v=$('#nt').value.trim();if(!v)return;cur.tasks.push({id:uid(),text:v,owner:$('#user').value.trim()||'Me',due:'',priority:'medium',done:false});$('#nt').value='';persist();render()}
$('#at').onclick=addTask;$('#nt').addEventListener('keydown',e=>e.key==='Enter'&&addTask());
const taskOf=el=>{const li=el.closest('.task');return li&&cur.tasks.find(t=>t.id===li.dataset.id)};
$('#tasks').addEventListener('input',e=>{const t=taskOf(e.target),f=e.target.dataset.f;if(t&&f&&f!=='done'&&f!=='priority'){t[f]=e.target.value;persist()}});
$('#tasks').addEventListener('change',e=>{const t=taskOf(e.target),f=e.target.dataset.f;if(!t||!f)return;t[f]=f==='done'?e.target.checked:e.target.value;persist();render()});
$('#tasks').addEventListener('click',e=>{if(e.target.matches('[data-del]')){const t=taskOf(e.target);cur.tasks=cur.tasks.filter(x=>x!==t);persist();render()}});
$('#saved').addEventListener('click',e=>{const o=e.target.closest('[data-open]'),r=e.target.closest('[data-rm]');
 if(o){cur=saved.find(s=>s.id===o.dataset.open);store('catchup.current',cur);render();scrollTo({top:0,behavior:'smooth'})}
 if(r){saved=saved.filter(s=>s.id!==r.dataset.rm);store('catchup.saved',saved);renderSaved()}});
$('#delall').onclick=()=>{if(confirm('Delete all saved summaries?')){saved=[];store('catchup.saved',saved);renderSaved()}};
render();
</script>
</body>
</html>
